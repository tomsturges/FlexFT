[project]
name = "flexft"
version = "0.2.0"
description = "Flexible-grid approximations to continuous Fourier transforms"
readme = "README.md"
authors = [{ name = "Thomas", email = "thomas.sturges@kit.edu" }]
license = "MIT"
keywords = [
    "bluestein",
    "continuous-fourier-transform",
    "fft",
    "fourier-transform",
    "jax",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.28",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/tomsturges/FlexFT"
Documentation = "https://tomsturges.github.io/FlexFT/"
Repository = "https://github.com/tomsturges/FlexFT"
Issues = "https://github.com/tomsturges/FlexFT/issues"

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29",
    "ipython>=8.37.0",
    "ipywidgets>=8.1.8",
    "jupyter>=1.1.1",
    "jupyterlab>=4.5.6",
    "jupytext>=1.19.1",
    "matplotlib>=3.7",
    "nbstripout>=0.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocs-bibtex>=4.4.0",
    "mkdocstrings>=1.0.4",
    "mkdocstrings-python>=2.0.4",
    "pymdown-extensions>=10.21.3",
]
